name: Deploy Theme to Lightsail Staging

on:
  push:
    branches: [staging]
    paths:
      - 'wordpress-theme/**'
      - '.github/workflows/deploy-lightsail.yml'

jobs:
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          echo "Checking PHP syntax in wordpress-theme/..."
          find wordpress-theme -name "*.php" -print0 | xargs -0 -n1 php -l
          echo "✅ All PHP files passed syntax check."

  deploy:
    name: Deploy via rsync to Lightsail
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync theme files to Lightsail home (temp)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/lightsail.pem -o StrictHostKeyChecking=no" \
            wordpress-theme/ \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:~/dl-auto-care-tmp/

      - name: Move files into WordPress themes dir and fix permissions
        run: |
          ssh -i ~/.ssh/lightsail.pem -o StrictHostKeyChecking=no \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            TMP="$HOME/dl-auto-care-tmp"
            sudo mkdir -p /opt/bitnami/wordpress/wp-content/themes/dl-auto-care/
            sudo cp -r "$TMP/." /opt/bitnami/wordpress/wp-content/themes/dl-auto-care/
            sudo chown -R bitnami:daemon /opt/bitnami/wordpress/wp-content/themes/dl-auto-care/
            find /opt/bitnami/wordpress/wp-content/themes/dl-auto-care/ -type f -exec sudo chmod 644 {} \;
            find /opt/bitnami/wordpress/wp-content/themes/dl-auto-care/ -type d -exec sudo chmod 755 {} \;
            rm -rf "$TMP"
            echo "✅ Deploy complete."
          EOF
