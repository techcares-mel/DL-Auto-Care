name: Deploy Theme to GoDaddy Staging

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-theme/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          echo "Checking PHP syntax in wordpress-theme/..."
          find wordpress-theme -name "*.php" -print0 | xargs -0 -n1 php -l
          echo "✅ All PHP files passed syntax check."

  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Deploy wordpress-theme to GoDaddy Staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./wordpress-theme/
          server-dir: /public_html/wp-content/themes/dl-auto-care/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            **/*.log
